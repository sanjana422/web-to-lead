<!DOCTYPE html>
<html>
<head>
<title>Welcome Our Industry</title>

<style>
body{
    margin:0;
    padding:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    font-family:Arial, sans-serif;
}

.welcome-box{
    text-align:center;
}

h1{
    font-size:60px;
    color:white;
    text-transform:uppercase;
    letter-spacing:3px;
    animation:shine 3s infinite linear;
}

p{
    color:#dfefff;
    font-size:20px;
    margin-top:10px;
}

@keyframes shine{
    0%{
        text-shadow:0 0 10px #fff,
                    0 0 20px #00e5ff,
                    0 0 30px #00e5ff;
    }

    50%{
        text-shadow:0 0 20px #fff,
                    0 0 40px #00e5ff,
                    0 0 60px #00e5ff;
    }

    100%{
        text-shadow:0 0 10px #fff,
                    0 0 20px #00e5ff,
                    0 0 30px #00e5ff;
    }
}
</style>

</head>

<body>

<div class="welcome-box">
    <h1>Welcome Our Industry</h1>
    <p>Thank You For Contacting Us</p>
</div>

</body>
</html>
